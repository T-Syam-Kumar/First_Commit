<style>

<script>
const Git = (() => {
  'use strict';
  const GH_USER = 'your-name';
  const GH_URL = 'https://github.com/your-name/my-project.git';
  const PATH = '/home/you/my-project';
  const GIT_COMMANDS = ['init', 'config', 'status', 'add', 'commit', 'log', 'diff', 'branch', 'switch', 'checkout', 'merge', 'remote', 'push', 'pull', 'fetch', 'restore'];
  const UNSUPPORTED = ['clone', 'reset', 'stash', 'rebase', 'tag', 'show', 'mv', 'rm', 'cherry-pick', 'revert', 'blame'];

  const L = (s, t) => ({ t: t || 'out', s: s });
  const fail = (msgs, explain) => ({ out: [].concat(msgs).map(m => L(m, 'bad')), explain: explain || '', ok: false });
  const done = (out, explain, ok) => ({ out: out || [], explain: explain || '', ok: ok !== false });
  const pl = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const short = id => id.slice(0, 7);
  const keys = o => Object.keys(o).sort();
  const SP = '        ';

  /* ---------- hashing & state ---------- */
  function hash(str, seed) {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
  }
  const makeId = str => (hash(str, 1) + hash(str, 2) + hash(str, 3)).slice(0, 40);

  function newState() {
    return {
      user: { name: '', email: '' },
      inited: false,
      files: {},
      index: {},
      objects: {},
      branches: {},
      head: 'main',
      remotes: {},
      tracking: {},
      remoteRefs: {},
      seq: 0,
      gh: { created: false, objects: {}, branches: {}, prs: [] },
      history: []
    };
  }

  const headId = s => s.branches[s.head] || null;
  const headTree = s => { const id = headId(s); return id ? s.objects[id].tree : {}; };
  const commitCount = s => Object.keys(s.objects).length;
  const authorOf = s => ({ name: s.user.name, email: s.user.email });

  function computeStatus(s) {
    const ht = headTree(s);
    const staged = [], unstaged = [], untracked = [];
    const paths = new Set([...Object.keys(ht), ...Object.keys(s.index)]);
    for (const p of [...paths].sort()) {
      const h = ht[p], i = s.index[p];
      if (h === undefined && i !== undefined) staged.push({ p, k: 'new file' });
      else if (h !== undefined && i === undefined) staged.push({ p, k: 'deleted' });
      else if (h !== i) staged.push({ p, k: 'modified' });
    }
    for (const p of keys(s.index)) {
      const w = s.files[p];
      if (w === undefined) unstaged.push({ p, k: 'deleted' });
      else if (w !== s.index[p]) unstaged.push({ p, k: 'modified' });
    }
    for (const p of keys(s.files)) if (s.index[p] === undefined) untracked.push(p);
    return { staged, unstaged, untracked };
  }

  /* ---------- graph helpers ---------- */
  function ancestors(objects, id) {
    const seen = new Set();
    const st = id ? [id] : [];
    while (st.length) {
      const x = st.pop();
      if (seen.has(x) || !objects[x]) continue;
      seen.add(x);
      objects[x].parents.forEach(p => st.push(p));
    }
    return seen;
  }
  const isAncestor = (objects, a, d) => !!a && !!d && ancestors(objects, d).has(a);
  function mergeBase(objects, a, b) {
    const A = ancestors(objects, a);
    let best = null;
    for (const x of ancestors(objects, b)) if (A.has(x) && (!best || objects[x].seq > objects[best].seq)) best = x;
    return best;
  }
  function makeCommit(s, store, msg, parents, tree, author) {
    s.seq++;
    const id = makeId(JSON.stringify([parents, tree, msg, s.seq]));
    store[id] = { id, msg, parents, tree: Object.assign({}, tree), author, seq: s.seq, time: Date.now() };
    return id;
  }
  function copyObjects(from, to, tipId) {
    let n = 0;
    for (const id of ancestors(from, tipId)) if (!to[id]) { to[id] = JSON.parse(JSON.stringify(from[id])); n++; }
    return n;
  }
  function setTree(s, oldT, newT) {
    const paths = new Set([...Object.keys(oldT), ...Object.keys(newT)]);
    for (const p of paths) {
      if (oldT[p] === newT[p]) continue;
      if (newT[p] === undefined) { delete s.files[p]; delete s.index[p]; }
      else { s.files[p] = newT[p]; s.index[p] = newT[p]; }
    }
  }
  function mergeTrees(base, ours, theirs) {
    const tree = {}, conflicts = [];
    const paths = new Set([...Object.keys(base), ...Object.keys(ours), ...Object.keys(theirs)]);
    for (const p of [...paths].sort()) {
      const b = base[p], o = ours[p], t = theirs[p];
      let v;
      if (o === t) v = o;
      else if (o === b) v = t;
      else if (t === b) v = o;
      else { conflicts.push(p); v = o; }
      if (v !== undefined) tree[p] = v;
    }
    return { tree, conflicts };
  }

  /* ---------- text diff ---------- */
  const splitLines = t => (t === '' || t === undefined) ? [] : t.replace(/\n$/, '').split('\n');
  function lineDiff(a, b) {
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { out.push({ t: ' ', s: a[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: '-', s: a[i] }); i++; }
      else { out.push({ t: '+', s: b[j] }); j++; }
    }
    while (i < n) out.push({ t: '-', s: a[i++] });
    while (j < m) out.push({ t: '+', s: b[j++] });
    return out;
  }
  function statSummary(oldT, newT) {
    const paths = new Set([...Object.keys(oldT), ...Object.keys(newT)]);
    let fc = 0, ins = 0, del = 0;
    const rows = [];
    for (const p of [...paths].sort()) {
      if (oldT[p] === newT[p]) continue;
      const d = lineDiff(splitLines(oldT[p]), splitLines(newT[p]));
      const a = d.filter(x => x.t === '+').length, r = d.filter(x => x.t === '-').length;
      fc++; ins += a; del += r;
      rows.push({ p, a, r, created: oldT[p] === undefined, deleted: newT[p] === undefined });
    }
    return { rows, fc, ins, del };
  }
  function summaryLine(st) {
    let t = ' ' + pl(st.fc, 'file') + ' changed';
    if (st.ins) t += ', ' + pl(st.ins, 'insertion') + '(+)';
    if (st.del) t += ', ' + pl(st.del, 'deletion') + '(-)';
    return t;
  }
  function statOut(st) {
    if (!st.rows.length) return [];
    const w = Math.max(...st.rows.map(r => r.p.length));
    return st.rows.map(r => L(' ' + r.p.padEnd(w) + ' | ' + (r.a + r.r) + ' ' + '+'.repeat(Math.min(r.a, 10)) + '-'.repeat(Math.min(r.r, 10))))
      .concat([L(summaryLine(st))]);
  }

  function fmtDate(t) {
    const d = new Date(t);
    const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()];
    const mo = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()];
    const p = n => String(n).padStart(2, '0');
    const off = -d.getTimezoneOffset(), ao = Math.abs(off);
    return wd + ' ' + mo + ' ' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' ' + d.getFullYear() + ' ' + (off >= 0 ? '+' : '-') + p(Math.floor(ao / 60)) + p(ao % 60);
  }

  /* ---------- tokenizer ---------- */
  function tokenize(line) {
    const toks = [];
    let cur = '', q = null, has = false;
    const push = () => { if (has || cur) { toks.push(cur); cur = ''; has = false; } };
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === q) q = null; else cur += c; continue; }
      if (c === '"' || c === "'") { q = c; has = true; continue; }
      if (c === ' ' || c === '\t') { push(); continue; }
      if (c === '>') {
        push();
        if (line[i + 1] === '>') { toks.push('>>'); i++; } else toks.push('>');
        continue;
      }
      cur += c; has = true;
    }
    if (q) return { error: true };
    push();
    return { toks };
  }

  /* ---------- levenshtein for typo hints ---------- */
  function lev(a, b) {
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return dp[a.length][b.length];
  }

  /* ---------- shell commands ---------- */
  const validName = n => /^[\w.-]+$/.test(n) && n !== '.' && n !== '..' && !/^\.git$/.test(n);
  const NAME_ERR = 'Use a simple file name like notes.txt. This practice folder has no subfolders.';

  function helpCmd() {
    return done([
      L('Commands in this practice terminal', 'info'),
      L('  Files   ls   cat <file>   touch <file>   rm <file>   clear'),
      L('          echo "text" > <file>     (write a file)'),
      L('          echo "text" >> <file>    (add a line to a file)'),
      L('  Git     git init | config | status | add | commit | log | diff'),
      L('          git branch | switch | merge | remote | push | pull | fetch | restore'),
      L('Tip: click a command in your steps to fill it in, then press Enter.', 'dim')
    ], 'Everything here behaves like real Git, just in a pretend folder called my-project.');
  }

  function echoCmd(s, args) {
    let op = args.findIndex(a => a === '>' || a === '>>');
    if (op === -1) return done([L(args.join(' '))], '');
    const text = args.slice(0, op).join(' ');
    const file = args[op + 1];
    if (!file) return fail("syntax error: missing file name after '" + args[op] + "'", 'Put a file name after the arrow, like: echo "hi" > notes.txt');
    if (!validName(file)) return fail('error: bad file name: ' + file, NAME_ERR);
    if (args[op] === '>') {
      s.files[file] = text + '\n';
      return done([], 'Wrote the text into ' + file + ', replacing anything that was there. Git has not been told about it yet.');
    }
    s.files[file] = (s.files[file] || '') + text + '\n';
    return done([], 'Added a new line to the end of ' + file + '. The arrow >> appends. A single > would replace the whole file.');
  }

  function shellCmd(s, c, a) {
    switch (c) {
      case 'help': return helpCmd();
      case 'clear': return { out: [], explain: '', ok: true, clear: true };
      case 'pwd': return done([L(PATH)]);
      case 'cd': return done([L('You are already inside my-project. This practice terminal has just this one folder.', 'dim')]);
      case 'ls': {
        const names = keys(s.files);
        return done(names.length ? [L(names.join('  '))] : [], names.length ? '' : 'The folder is empty.');
      }
      case 'cat': {
        if (!a[0]) return fail('cat: missing file name');
        if (s.files[a[0]] === undefined) return fail('cat: ' + a[0] + ': No such file or directory');
        return done(splitLines(s.files[a[0]]).map(x => L(x)));
      }
      case 'touch': {
        if (!a.length) return fail('touch: missing file name');
        for (const n of a) if (!validName(n)) return fail('touch: bad file name: ' + n, NAME_ERR);
        a.forEach(n => { if (s.files[n] === undefined) s.files[n] = ''; });
        return done([], 'Created an empty file. Git has not been told about it yet.');
      }
      case 'rm': {
        const names = a.filter(x => !x.startsWith('-'));
        if (!names.length) return fail('rm: missing file name');
        for (const n of names) if (s.files[n] === undefined) return fail("rm: cannot remove '" + n + "': No such file or directory");
        names.forEach(n => { delete s.files[n]; });
        return done([], 'Deleted from your folder. If the file was committed before, Git still has it, and git restore can bring it back.');
      }
      case 'echo': return echoCmd(s, a);
    }
    return null;
  }

  /* ---------- git commands ---------- */
  function nothingToCommit(s) {
    const st = computeStatus(s);
    const out = [L('On branch ' + s.head)];
    if (!headId(s)) out.push(L(''), L('Initial commit'), L(''));
    if (st.unstaged.length) out.push(L('no changes added to commit (use "git add" and/or "git commit -a")'));
    else if (st.untracked.length) out.push(L('nothing added to commit but untracked files present (use "git add" to track)'));
    else if (!headId(s)) out.push(L('nothing to commit (create/copy files and use "git add" to track)'));
    else out.push(L('nothing to commit, working tree clean'));
    return out;
  }

  function gInit(s) {
    if (s.inited) return done([L('Reinitialized existing Git repository in ' + PATH + '/.git/')], 'This folder was already a repository, so nothing changed.');
    s.inited = true;
    return done([L('Initialized empty Git repository in ' + PATH + '/.git/')],
      'git init created a hidden .git folder. That folder is the repository: Git\'s private notebook of your project\'s history. No snapshots exist yet.');
  }

  function gConfig(s, args) {
    const a = args.filter(x => x !== '--global' && x !== '--local');
    if (a[0] === '--list' || a[0] === '-l') {
      const out = [];
      if (s.user.name) out.push(L('user.name=' + s.user.name));
      if (s.user.email) out.push(L('user.email=' + s.user.email));
      return done(out, 'These are the settings Git will use.');
    }
    if (!a.length) return fail('usage: git config [--global] <name> [<value>]');
    const key = a[0];
    if (a.length === 1) {
      const v = key === 'user.name' ? s.user.name : key === 'user.email' ? s.user.email : '';
      return done(v ? [L(v)] : [], v ? '' : 'That setting is empty.');
    }
    const val = a.slice(1).join(' ');
    if (key === 'user.name') s.user.name = val;
    else if (key === 'user.email') s.user.email = val;
    else return done([], 'Saved. This practice terminal only uses user.name and user.email.');
    return done([], 'Saved. Git now stamps your ' + (key === 'user.name' ? 'name' : 'email') + ' on every commit you make.' + (s.user.name && s.user.email ? ' You only do this once per computer.' : ''));
  }

  function aheadBehind(s, local, remote) {
    const A = ancestors(s.objects, local), B = ancestors(s.objects, remote);
    return { ahead: [...A].filter(x => !B.has(x)).length, behind: [...B].filter(x => !A.has(x)).length };
  }

  function gStatus(s, args) {
    const st = computeStatus(s);
    if (args.includes('-s') || args.includes('--short')) {
      const map = {};
      st.staged.forEach(x => { map[x.p] = [{ 'new file': 'A', modified: 'M', deleted: 'D' }[x.k], ' ']; });
      st.unstaged.forEach(x => { map[x.p] = map[x.p] || [' ', ' ']; map[x.p][1] = x.k === 'deleted' ? 'D' : 'M'; });
      const out = keys(map).map(p => L(map[p][0] + map[p][1] + ' ' + p, map[p][1] !== ' ' ? 'bad' : 'ok'));
      st.untracked.forEach(p => out.push(L('?? ' + p, 'bad')));
      return done(out, 'Short format: the left letter is staged, the right letter is not staged yet, ?? means untracked.');
    }
    const out = [L('On branch ' + s.head)];
    const head = headId(s);
    const up = s.tracking[s.head];
    if (up && head && s.remoteRefs[up]) {
      const ab = aheadBehind(s, head, s.remoteRefs[up]);
      if (!ab.ahead && !ab.behind) out.push(L("Your branch is up to date with '" + up + "'."));
      else if (ab.ahead && !ab.behind) out.push(L("Your branch is ahead of '" + up + "' by " + pl(ab.ahead, 'commit') + '.'), L('  (use "git push" to publish your local commits)'));
      else if (!ab.ahead && ab.behind) out.push(L("Your branch is behind '" + up + "' by " + pl(ab.behind, 'commit') + ', and can be fast-forwarded.'), L('  (use "git pull" to update your local branch)'));
      else out.push(L("Your branch and '" + up + "' have diverged."));
    }
    if (!head) out.push(L(''), L('No commits yet'), L(''));
    else out.push(L(''));
    if (st.staged.length) {
      out.push(L('Changes to be committed:'), L('  (use "git restore --staged <file>..." to unstage)'));
      st.staged.forEach(x => out.push(L(SP + (x.k + ':').padEnd(12) + x.p, 'ok')));
      out.push(L(''));
    }
    if (st.unstaged.length) {
      out.push(L('Changes not staged for commit:'), L('  (use "git add <file>..." to update what will be committed)'), L('  (use "git restore <file>..." to discard changes in working directory)'));
      st.unstaged.forEach(x => out.push(L(SP + (x.k + ':').padEnd(12) + x.p, 'bad')));
      out.push(L(''));
    }
    if (st.untracked.length) {
      out.push(L('Untracked files:'), L('  (use "git add <file>..." to include in what will be committed)'));
      st.untracked.forEach(p => out.push(L(SP + p, 'bad')));
      out.push(L(''));
    }
    if (st.staged.length) { /* no footer */ }
    else if (st.unstaged.length) out.push(L('no changes added to commit (use "git add" and/or "git commit -a")'));
    else if (st.untracked.length) out.push(L('nothing added to commit but untracked files present (use "git add" to track)'));
    else if (!head) out.push(L('nothing to commit (create/copy files and use "git add" to track)'));
    else out.push(L('nothing to commit, working tree clean'));

    let ex;
    if (st.staged.length && (st.unstaged.length || st.untracked.length)) ex = 'Green files are staged and will go into the next commit. Red files are not staged, so they would be left out.';
    else if (st.staged.length) ex = 'Green files are in the staging area. They will be saved by the next git commit.';
    else if (st.untracked.length) ex = 'Red untracked files exist in your folder, but Git is not tracking them yet. git add will stage them.';
    else if (st.unstaged.length) ex = 'Red modified files changed since the last snapshot. git add stages a change, git restore throws it away.';
    else if (head) ex = 'Clean means your folder matches your latest commit exactly. Nothing is waiting to be saved.';
    else ex = 'This repository has no commits yet and the folder has no files. Create a file, then git add and git commit.';
    return done(out, ex);
  }

  function gAdd(s, args) {
    const targets = args.filter(a => !a.startsWith('-') || a === '-A');
    if (!targets.length) return done([L('Nothing specified, nothing added.'), L("hint: Maybe you wanted to say 'git add .'?")], 'Tell git add which file to stage, for example git add hello.txt, or git add . for everything.', false);
    const all = targets.includes('.') || targets.includes('-A');
    if (!all) for (const p of targets) if (s.files[p] === undefined && s.index[p] === undefined) return fail("fatal: pathspec '" + p + "' did not match any files", 'Git cannot find a file with that name. Run ls to see the files in your folder.');
    const stage = p => { if (s.files[p] === undefined) delete s.index[p]; else s.index[p] = s.files[p]; };
    if (all) new Set([...Object.keys(s.files), ...Object.keys(s.index)]).forEach(stage);
    else targets.forEach(stage);
    return done([], all ? 'Staged every change in the folder. The Staging panel shows what the next commit will contain.' :
      'Copied the current version of ' + targets.join(', ') + ' into the staging area. Edit the file again later and you would need to git add it again.');
  }

  function gCommit(s, args) {
    let all = false, msg = null;
    for (let i = 0; i < args.length; i++) {
      const a = args[i];
      if (a === '-m' || a === '--message') {
        msg = args[++i];
        if (msg === undefined) return fail("error: switch 'm' requires a value", 'Put your message in quotes after -m, like: git commit -m "Add hello file"');
      } else if (a === '--all') all = true;
      else if (/^-[a-z]+$/.test(a)) {
        if (a.includes('a')) all = true;
        if (a.endsWith('m')) {
          msg = args[++i];
          if (msg === undefined) return fail("error: switch 'm' requires a value", 'Put your message in quotes after -m.');
        }
      } else return fail('error: unknown option: ' + a);
    }
    if (!s.user.name || !s.user.email) {
      return fail(['Author identity unknown', '', '*** Please tell me who you are.', '', 'Run', '', '  git config --global user.email "you@example.com"', '  git config --global user.name "Your Name"', '', "to set your account's default identity."],
        'Git puts your name and email on every commit. Set them once with the two git config commands above, then commit again.');
    }
    if (msg === null || !msg.trim()) return fail('Aborting commit due to empty commit message.', 'A commit needs a message. This practice terminal cannot open an editor, so add one with -m "your message".');
    if (all) Object.keys(s.index).forEach(p => { if (s.files[p] === undefined) delete s.index[p]; else s.index[p] = s.files[p]; });
    const oldT = headTree(s);
    const stt = statSummary(oldT, s.index);
    if (!stt.rows.length) {
      const st = computeStatus(s);
      return { out: nothingToCommit(s).map(o => Object.assign({}, o, { t: 'bad' })), ok: false,
        explain: (st.unstaged.length || st.untracked.length) ? 'Nothing is staged, so there is nothing to save. Use git add first, or git commit -am to include changes to files Git already tracks.' : 'There are no changes since the last commit.' };
    }
    const parent = headId(s);
    const id = makeCommit(s, s.objects, msg.trim(), parent ? [parent] : [], s.index, authorOf(s));
    s.branches[s.head] = id;
    const out = [L('[' + s.head + (parent ? '' : ' (root-commit)') + ' ' + short(id) + '] ' + msg.trim()), L(summaryLine(stt))];
    stt.rows.forEach(r => { if (r.created) out.push(L(' create mode 100644 ' + r.p)); if (r.deleted) out.push(L(' delete mode 100644 ' + r.p)); });
    return done(out, 'A commit is a saved snapshot of everything in the staging area, plus your message. ' + short(id) + ' is its short ID. It now appears as a dot in the Repository panel.');
  }

  function decorations(s, id) {
    const labs = [];
    if (headId(s) === id) labs.push('HEAD -> ' + s.head);
    keys(s.branches).forEach(b => { if (b !== s.head && s.branches[b] === id) labs.push(b); });
    keys(s.remoteRefs).forEach(r => { if (s.remoteRefs[r] === id) labs.push(r); });
    return labs;
  }

  function gLog(s, args) {
    const head = headId(s);
    if (!head) return fail("fatal: your current branch '" + s.head + "' does not have any commits yet", 'There is no history yet. Make your first commit, then try again.');
    const one = args.includes('--oneline');
    const ids = [...ancestors(s.objects, head)].sort((a, b) => s.objects[b].seq - s.objects[a].seq);
    const out = [];
    ids.forEach(id => {
      const c = s.objects[id];
      const labs = decorations(s, id);
      if (one) {
        out.push(L(short(id) + (labs.length ? ' (' + labs.join(', ') + ')' : '') + ' ' + c.msg));
      } else {
        out.push(L('commit ' + id + (labs.length ? ' (' + labs.join(', ') + ')' : ''), 'warn'));
        if (c.parents.length > 1) out.push(L('Merge: ' + c.parents.map(short).join(' ')));
        out.push(L('Author: ' + c.author.name + ' <' + c.author.email + '>'), L('Date:   ' + fmtDate(c.time)), L(''), L('    ' + c.msg), L(''));
      }
    });
    return done(out, one ? 'One line per commit: short ID, which branches point at it, then the message. Newest is on top.' :
      'git log lists commits newest first. Each has a long unique ID, an author, a date and your message. Add --oneline for a compact view.');
  }

  function gDiff(s, args) {
    const staged = args.includes('--staged') || args.includes('--cached');
    const A = staged ? headTree(s) : s.index;
    const B = staged ? s.index : s.files;
    const paths = staged ? [...new Set([...Object.keys(A), ...Object.keys(B)])].sort() : keys(s.index);
    const out = [];
    paths.forEach(p => {
      const a = A[p], b = B[p];
      if (a === b) return;
      out.push(L('diff --git a/' + p + ' b/' + p, 'dim'));
      if (a === undefined) out.push(L('new file mode 100644', 'dim'), L('--- /dev/null', 'dim'), L('+++ b/' + p, 'dim'));
      else if (b === undefined) out.push(L('deleted file mode 100644', 'dim'), L('--- a/' + p, 'dim'), L('+++ /dev/null', 'dim'));
      else out.push(L('--- a/' + p, 'dim'), L('+++ b/' + p, 'dim'));
      out.push(L('@@ changes in ' + p + ' @@', 'info'));
      lineDiff(splitLines(a), splitLines(b)).forEach(d => out.push(L(d.t + d.s, d.t === '+' ? 'ok' : d.t === '-' ? 'bad' : 'out')));
    });
    if (!out.length) return done([], staged ? 'Nothing is staged, so there is nothing to show.' : 'No differences to show. git diff compares your folder with the staging area, so it is empty right after git add. It also ignores untracked files. Try git diff --staged to see what is staged.');
    return done(out, 'Lines starting with - (red) were removed and lines starting with + (green) were added. ' + (staged ? 'This is what your next commit will contain.' : 'This is what git add would stage.'));
  }

  const validBranch = n => /^[\w./-]+$/.test(n) && !n.startsWith('-') && !n.endsWith('/');

  function gBranch(s, args) {
    const del = args.includes('-d') || args.includes('-D');
    const force = args.includes('-D');
    const names = args.filter(a => !a.startsWith('-'));
    if (del) {
      if (!names.length) return fail('fatal: branch name required');
      const n = names[0];
      if (s.branches[n] === undefined) return fail("error: branch '" + n + "' not found.");
      if (n === s.head) return fail("error: cannot delete branch '" + n + "' used by worktree at '" + PATH + "'", 'You cannot delete the branch you are standing on. Switch to another branch first.');
      if (!force && !isAncestor(s.objects, s.branches[n], headId(s))) return fail(["error: the branch '" + n + "' is not fully merged.", "If you are sure you want to delete it, run 'git branch -D " + n + "'."], 'Git protects you here: that branch has commits that are not in your current branch yet.');
      const id = s.branches[n];
      delete s.branches[n];
      return done([L('Deleted branch ' + n + ' (was ' + short(id) + ').')], 'The branch label is gone. Its commits are still in the history because main contains them.');
    }
    if (!names.length) {
      const out = keys(s.branches).map(b => L((b === s.head ? '* ' : '  ') + b, b === s.head ? 'ok' : 'out'));
      if (!out.length) return done([], 'There are no branches yet because there are no commits. A branch only exists once it points at a commit.');

        return '<span class="pill ' + t.kind + '">' + esc(t.kind === 'head' ? 'HEAD → ' + t.label : t.label) + '</span>';
      }).join('');
      return '<div class="grow" data-k="c:' + r.id + '" data-sig="' + r.id + pills.length + '"><svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' + g + '</svg><div class="gtext"><span class="cid">' + Git.short(r.id) + '</span>' + pills + '<span class="cmsg" title="' + esc(r.c.msg) + '">' + esc(r.c.msg) + '</span></div></div>';
    }).join('');
  }
  function tipsLocal() {
    var tips = [];
    Object.keys(S.branches).sort(function (a, b) { return a === 'main' ? -1 : b === 'main' ? 1 : a.localeCompare(b); }).forEach(function (b) {
      tips.push({ id: S.branches[b], label: b, kind: b === S.head ? 'head' : 'branch' });
    });
    Object.keys(S.remoteRefs).sort().forEach(function (r) { tips.push({ id: S.remoteRefs[r], label: r, kind: 'remote' }); });
    return tips;
  }
  function zone(n, title, sub, body) {
    return '<div class="zone"><div class="zone-h"><span class="zone-n">' + n + '</span><div><h3>' + title + '</h3><p class="zone-sub">' + sub + '</p></div></div>' + body + '</div>';
  }
  function firstLine(t) { var l = (t || '').split('\n')[0]; return l ? (l.length > 38 ? l.slice(0, 38) + '…' : l) : '(empty file)'; }
  function folderHtml() {
    var ht = Git.headTree(S);
    var names = Object.keys(S.files).concat(Object.keys(S.index).filter(function (p) { return S.files[p] === undefined; })).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
    if (!names.length) return '<p class="empty">The folder is empty. Create a file with <code>echo</code>.</p>';
    return '<ul class="list">' + names.map(function (p) {
      var tag, cls, del = false;
      if (S.files[p] === undefined) { tag = 'deleted'; cls = 'bad'; del = true; }
      else if (S.index[p] === undefined) { tag = 'untracked'; cls = 'bad'; }
      else if (S.files[p] !== S.index[p]) { tag = 'modified'; cls = 'warn'; }
      else if (S.index[p] !== ht[p]) { tag = 'staged'; cls = 'good'; }
      else { tag = 'saved'; cls = 'mute'; }
      return '<li class="file' + (del ? ' is-deleted' : '') + '" data-k="f:' + esc(p) + '" data-sig="' + tag + ':' + esc(S.files[p] || '') + '"><span class="fname">' + esc(p) + '</span><span class="tag tag-' + cls + '">' + tag + '</span>' + (del ? '' : '<span class="fprev">' + esc(firstLine(S.files[p])) + '</span>') + '</li>';
    }).join('') + '</ul>';
  }
  function stagingHtml() {
    var st = Git.computeStatus(S).staged;
    if (!st.length) return '<p class="empty">Nothing staged. <code>git add</code> moves changes here.</p>';
    return '<ul class="list">' + st.map(function (x) {
      return '<li class="file" data-k="s:' + esc(x.p) + '" data-sig="' + x.k + '"><span class="fname">' + esc(x.p) + '</span><span class="tag tag-good">' + x.k + '</span></li>';
    }).join('') + '</ul>';
  }
  function repoHtml() {
    var tips = tipsLocal();
    var g = graphHtml(S.objects, tips);
    if (!g) return '<p class="empty">' + (S.inited ? 'No commits yet. Each commit will appear here as a dot.' : 'Not a repository yet. <code>git init</code> creates one.') + '</p>';
    return '<div class="graph">' + g + '</div>';
  }
  function ghHtml() {
    var g = S.gh, has = Object.keys(g.branches).length;
    if (!g.created) return '<p class="empty">No repository on GitHub yet. In real life you create one on github.com.</p><div><button type="button" class="btn small" data-act="gh-create">Create repository</button></div>';
    var h = '<code class="gh-url">' + esc(GH_URL) + '</code>';
    if (!has) return h + '<p class="empty">The repository is empty. Connect your folder to it, then push.</p><div class="chips"><button type="button" class="chip" data-cmd="git remote add origin ' + esc(GH_URL) + '"><i>$</i><span>git remote add origin ' + esc(GH_URL) + '</span></button></div>';
    Git.ghCandidates(S).forEach(function (b) {
      h += '<div class="pr-banner" data-k="b:' + esc(b) + '" data-sig="x"><span><b>' + esc(b) + '</b> had recent pushes</span><button type="button" class="btn small" data-act="pr-open" data-branch="' + esc(b) + '">Compare &amp; pull request</button></div>';
    });
    g.prs.slice().reverse().forEach(function (p) {
      h += '<div class="pr" data-k="pr:' + p.n + '" data-sig="' + p.state + '"><span>#' + p.n + ' ' + esc(p.title) + '</span>' + (p.state === 'open' ? '<span><button type="button" class="btn small" data-act="pr-merge" data-n="' + p.n + '">Merge pull request</button></span>' : '<span class="pr-s merged">Merged</span>') + '</div>';
    });
    var tips = Object.keys(g.branches).sort(function (a, b) { return a === 'main' ? -1 : b === 'main' ? 1 : a.localeCompare(b); }).map(function (b) { return { id: g.branches[b], label: b, kind: 'branch' }; });
    return h + '<div class="graph">' + graphHtml(g.objects, tips) + '</div>';
  }
  function updateZones() {
    var z = $('#zones'); if (!z) return;
    z.innerHTML =
      zone(1, 'Working folder', 'Your files · next: <code>git add</code>', folderHtml()) +
      zone(2, 'Staging area', 'Ready for the next commit · next: <code>git commit</code>', stagingHtml()) +
      zone(3, 'Repository', 'Your saved history, on this computer · next: <code>git push</code>', repoHtml()) +
      zone(4, 'GitHub', 'Online copy · back down: <code>git pull</code>', ghHtml());
    var sig = {};
    z.querySelectorAll('[data-k]').forEach(function (el) {
      var k = el.getAttribute('data-k'), s = el.getAttribute('data-sig');
      sig[k] = s;
      if (flashOn && prevSig[k] !== s) el.classList.add('flash');
    });
    prevSig = sig;
  }
  function updateAll() { updateZones(); updateGuide(); }

  /* ---------- cheat sheet ---------- */
  function renderCheat() {
    view = 'cheat';
    var h = '<div class="doc"><header class="lesson-head"><span class="eyebrow">Reference</span><h1>Cheat sheet</h1><p>Every command from the lessons, grouped by what you are trying to do.</p></header>';
    h += '<div class="cs-group"><h2>The big picture</h2><div class="flow"><span class="node">Working folder</span><span class="arrow">git add →</span><span class="node">Staging area</span><span class="arrow">git commit →</span><span class="node">Repository</span><span class="arrow">git push →</span><span class="node">GitHub</span></div><p class="hint">Going the other way, <code>git pull</code> brings GitHub\'s new commits into your repository and folder.</p></div>';
    CHEAT.forEach(function (g) {
      h += '<div class="cs-group"><h2>' + esc(g.h) + '</h2><div class="cs-table">' + g.rows.map(function (r) { return '<div class="cs-row"><code>' + esc(r[0]) + '</code><span>' + esc(r[1]) + '</span></div>'; }).join('') + '</div></div>';
    });
    h += '<div class="cs-group"><h2>What to learn next</h2><ul class="next-list">' + NEXT.map(function (n) { return '<li>' + n + '</li>'; }).join('') + '</ul></div></div>';
    mainEl.innerHTML = h;
    renderNav();
    window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-lesson],[data-view],[data-cmd],[data-q],[data-act]');
    if (!t) { if (e.target.closest('.term-out')) { var i0 = $('#termInput'); if (i0 && !String(window.getSelection())) i0.focus(); } return; }
    if (t.hasAttribute('data-lesson')) { startLesson(parseInt(t.getAttribute('data-lesson'), 10)); window.scrollTo(0, 0); return; }
    if (t.getAttribute('data-view') === 'cheat') { renderCheat(); return; }
    if (t.hasAttribute('data-cmd')) { var inp = $('#termInput'); if (inp) { inp.value = t.getAttribute('data-cmd'); inp.focus(); } return; }
    if (t.hasAttribute('data-q')) { quizPick[LESSONS[cur].id] = parseInt(t.getAttribute('data-q'), 10); updateGuide(); return; }
    var act = t.getAttribute('data-act');
    if (act === 'reset') startLesson(cur);
    else if (act === 'reset-progress') { progress = { done: {}, cur: 0 }; quizPick = {}; save(); startLesson(0); }
    else if (act === 'gh-create') { Git.ghCreate(S); setCoach('info', 'Created an empty repository on GitHub. Copy its address from the GitHub panel when you connect your folder to it with git remote add.'); updateAll(); }
    else if (act === 'pr-open') { var r1 = Git.ghOpenPR(S, t.getAttribute('data-branch')); if (r1.ok) setCoach('info', 'Opened pull request #' + r1.n + '. On a real team, people would now read your change and leave comments. When it looks good, merge it.'); updateAll(); }
    else if (act === 'pr-merge') { var r2 = Git.ghMergePR(S, parseInt(t.getAttribute('data-n'), 10)); setCoach(r2.ok ? 'info' : 'err', r2.ok ? 'GitHub merged the branch into its main. Your computer does not know yet: your local main is behind. Switch to main and run git pull to catch up.' : r2.msg); updateAll(); }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'termForm') return;
    e.preventDefault();
    var inp = $('#termInput'); var v = inp.value; inp.value = '';
    exec(v);
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.id !== 'termInput') return;
    if (e.key === 'ArrowUp') { if (histPos > 0) { histPos--; e.target.value = cmdHist[histPos] || ''; } e.preventDefault(); }
    else if (e.key === 'ArrowDown') { if (histPos < cmdHist.length) histPos++; e.target.value = cmdHist[histPos] || ''; e.preventDefault(); }
  });

  var start = Math.min(Math.max(progress.cur || 0, 0), LESSONS.length - 1);
  startLesson(start);
})();
</script>

</body></html>
